<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outreach Sender</title>
  <style>
    :root {
      --bg: #0f131a;
      --card: #171d27;
      --border: #273041;
      --text: #e8eef8;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 20px; }
    .topbar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px;
      margin-bottom: 16px;
    }
    .brand { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
      padding: 4px 10px; border-radius: 999px; background: #1e293b; border: 1px solid var(--border);
    }
    .pill.ok { color: #86efac; border-color: #166534; background: #052e16; }
    .pill.warn { color: #fde68a; border-color: #92400e; background: #451a03; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;
    }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .lang-btn.active-lang { background: var(--accent); color: #fff; border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: 380px 1fr; gap: 16px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
      margin-bottom: 16px;
    }
    h2 { margin: 0 0 12px; font-size: 16px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%; background: #0b0e14; color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 11px; font-size: 13px; font-family: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      border: 0; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-green { background: var(--green); color: #052e16; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-ghost { background: #1f2735; color: var(--text); border: 1px solid var(--border); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .alert { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top: 10px; border: 1px solid; }
    .alert.ok { background: #052e16; border-color: #166534; color: #bbf7d0; }
    .alert.warn { background: #451a03; border-color: #92400e; color: #fde68a; }
    .alert.err { background: #450a0a; border-color: #991b1b; color: #fecaca; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .scroll-table { max-height: 360px; overflow: auto; }
    .log-box {
      background: #090c10; border: 1px solid var(--border); border-radius: 8px; padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
      height: 180px; overflow: auto; white-space: pre-wrap; color: #cbd5e1;
    }
    .hidden { display: none; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: none;
      align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal-bg.open { display: flex; }
    .modal { max-width: 560px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <span data-i18n="appTitle">Email Outreach Panel</span>
        <span class="pill ok" id="shield-badge"></span>
        <span class="pill" id="tg-badge"></span>
      </div>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <span class="pill" id="stat-today"></span>
        <span class="pill" id="stat-total"></span>
        <span class="pill" id="run-badge"></span>
        <button class="btn btn-red hidden" id="btn-stop-top" data-i18n="stopTopBtn" onclick="stopCampaign()"></button>
        <div style="display:flex; gap:4px;">
          <button class="btn btn-ghost lang-btn" id="lang-btn-ru" style="padding:5px 9px;font-size:12px;" onclick="setUiLang('ru')">RU</button>
          <button class="btn btn-ghost lang-btn" id="lang-btn-en" style="padding:5px 9px;font-size:12px;" onclick="setUiLang('en')">EN</button>
          <button class="btn btn-ghost lang-btn" id="lang-btn-id" style="padding:5px 9px;font-size:12px;" onclick="setUiLang('id')">ID</button>
        </div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-btn-send" data-i18n="tab1" onclick="switchTab('send', this)"></button>
      <button class="tab-btn" id="tab-btn-templates" data-i18n="tab2" onclick="switchTab('templates', this)"></button>
      <button class="tab-btn" id="tab-btn-accounts" data-i18n="tab3" onclick="switchTab('accounts', this)"></button>
      <button class="tab-btn" id="tab-btn-inbox" data-i18n="tab4" onclick="switchTab('inbox', this)"></button>
    </div>

    <!-- TAB 1: SEND -->
    <div id="tab-send">
      <div class="grid">
        <div>
          <div class="card">
            <h2 data-i18n="waveSettings"></h2>
            <label data-i18n="senderChannelLbl"></label>
            <select id="account-select"></select>

            <label data-i18n="sourceBaseLbl"></label>
            <select id="source-select" onchange="loadLeads()"></select>

            <div class="row">
              <div>
                <label data-i18n="marketLbl"></label>
                <select id="market-select" onchange="loadLeads()">
                  <option value="ALL" data-i18n="mktAll"></option>
                  <option value="EN" data-i18n="mktEN"></option>
                  <option value="ID" data-i18n="mktID"></option>
                  <option value="RU" data-i18n="mktRU"></option>
                  <option value="UA" data-i18n="mktUA"></option>
                </select>
              </div>
              <div>
                <label data-i18n="siteStatusLbl"></label>
                <select id="site-select" onchange="loadLeads()">
                  <option value="ALL" data-i18n="siteAll"></option>
                  <option value="no_site" data-i18n="siteNo"></option>
                  <option value="has_site" data-i18n="siteHas"></option>
                </select>
              </div>
            </div>

            <label data-i18n="templateLbl"></label>
            <select id="template-select">
              <option value="" data-i18n="tplAuto"></option>
            </select>

            <div class="row">
              <div>
                <label data-i18n="maxDailyLbl"></label>
                <input type="number" id="limit-input" value="25" min="1" max="50">
              </div>
              <div>
                <label data-i18n="delayLbl"></label>
                <div class="row">
                  <input type="number" id="min-delay" value="90" min="45">
                  <input type="number" id="max-delay" value="180" min="45">
                </div>
              </div>
            </div>

            <div id="safety-box"></div>

            <div class="btn-row">
              <button class="btn btn-ghost" data-i18n="checkBtn" onclick="runSafetyCheck()"></button>
              <button class="btn btn-green" id="btn-start" data-i18n="startBtn" onclick="openConfirmModal()"></button>
            </div>
          </div>

          <div class="card">
            <h2 data-i18n="quickTestTitle"></h2>
            <div style="display:flex; gap:8px;">
              <input type="email" id="test-email" data-i18n-ph="testEmailPh">
              <button class="btn btn-primary" data-i18n="testBtn" onclick="sendTest()"></button>
            </div>
            <div id="test-result"></div>
          </div>
        </div>

        <div>
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
              <h2 style="margin:0;"><span data-i18n="queueTitle"></span> <span class="pill" id="queue-count">0</span></h2>
              <input type="text" id="search-leads" data-i18n-ph="searchPh" style="max-width:260px;" oninput="loadLeads()">
            </div>
            <div id="queue-stats" style="font-size:12px; color:var(--muted); margin-bottom:8px;"></div>
            <div class="scroll-table">
              <table>
                <thead>
                  <tr>
                    <th data-i18n="thEmail"></th>
                    <th data-i18n="thCompany"></th>
                    <th data-i18n="thPhone"></th>
                    <th data-i18n="thMarket"></th>
                    <th data-i18n="thSite"></th>
                    <th data-i18n="thCityNiche"></th>
                  </tr>
                </thead>
                <tbody id="leads-tbody"></tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <h2 data-i18n="importTitle"></h2>
            <textarea id="import-text" data-i18n-ph="importPh"></textarea>
            <div class="row">
              <div>
                <label data-i18n="importTargetLbl"></label>
                <select id="import-target">
                  <option value="contacts.csv" data-i18n="targetContacts"></option>
                  <option value="leads_ready.csv" data-i18n="targetReady"></option>
                </select>
              </div>
              <div style="display:flex; align-items:flex-end;">
                <button class="btn btn-primary" style="width:100%;" data-i18n="importBtn" onclick="importLeads()"></button>
              </div>
            </div>
            <div id="import-result"></div>
          </div>

          <div class="card">
            <h2><span data-i18n="liveLogTitle"></span> <span class="pill" id="progress-pill">0 / 0</span></h2>
            <div class="log-box" id="log-box"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 2: TEMPLATES -->
    <div id="tab-templates" class="hidden">
      <div class="grid">
        <div class="card">
          <h2 data-i18n="tplEditorTitle"></h2>
          <label data-i18n="selectTplLbl"></label>
          <select id="edit-tpl-select" onchange="loadTemplateIntoEditor()"></select>
          <label data-i18n="tplSubjectLbl"></label>
          <input type="text" id="edit-tpl-subject">
          <label data-i18n="tplBodyLbl"></label>
          <textarea id="edit-tpl-body" style="min-height:220px;"></textarea>
          <div class="btn-row">
            <button class="btn btn-ghost" data-i18n="checkBtn" onclick="previewTemplateEditor()"></button>
            <button class="btn btn-primary" data-i18n="saveTplBtn" onclick="saveTemplateEditor()"></button>
          </div>
          <div id="tpl-save-result"></div>
        </div>
        <div class="card">
          <h2 data-i18n="clientPreviewTitle"></h2>
          <div id="tpl-preview-box" style="background:#0b0e14; padding:14px; border-radius:8px; border:1px solid var(--border); white-space:pre-wrap; font-size:13px;"></div>
          <div id="tpl-safety-result"></div>
        </div>
      </div>
    </div>

    <!-- TAB 3: ACCOUNTS & GUARDRAILS -->
    <div id="tab-accounts" class="hidden">
      <div class="grid">
        <div class="card">
          <h2 data-i18n="smtpTitle"></h2>
          <p style="font-size:12px; color:var(--muted); margin-top:0;" data-i18n="smtpHint"></p>
          <label data-i18n="smtpHostLbl"></label>
          <input type="text" id="smtp-host" value="smtp.gmail.com">
          <div class="row">
            <div>
              <label data-i18n="portLbl"></label>
              <input type="number" id="smtp-port" value="465">
            </div>
            <div>
              <label data-i18n="senderNameLbl"></label>
              <input type="text" id="smtp-name" data-i18n-ph="senderNamePh">
            </div>
          </div>
          <label data-i18n="smtpUserLbl"></label>
          <input type="email" id="smtp-user" placeholder="example@gmail.com">
          <label data-i18n="smtpPassLbl"></label>
          <input type="password" id="smtp-pass" placeholder="xxxx xxxx xxxx xxxx">
          <div class="btn-row">
            <button class="btn btn-primary" data-i18n="smtpSaveBtn" onclick="addSmtpAccount()"></button>
          </div>
          <div id="smtp-result"></div>
        </div>

        <div>
          <div class="card">
            <h2 data-i18n="imapTitle"></h2>
            <p style="font-size:12px; color:var(--muted); margin-top:0;" data-i18n="imapHint"></p>
            <div class="row">
              <div>
                <label data-i18n="imapHostLbl"></label>
                <input type="text" id="imap-host" value="imap.gmail.com">
              </div>
              <div>
                <label data-i18n="portLbl"></label>
                <input type="number" id="imap-port" value="993">
              </div>
            </div>
            <label data-i18n="imapUserLbl"></label>
            <input type="email" id="imap-user" placeholder="work@gmail.com">
            <label data-i18n="imapPassLbl"></label>
            <input type="password" id="imap-pass" placeholder="xxxx xxxx xxxx xxxx">
            <div class="btn-row">
              <button class="btn btn-primary" data-i18n="imapSaveBtn" onclick="saveImap()"></button>
            </div>
            <div id="imap-result"></div>
          </div>

          <div class="card">
            <h2 data-i18n="connectedChannelsTitle"></h2>
            <div id="accounts-list"></div>
          </div>

          <div class="card">
            <h2 data-i18n="blacklistTitle"></h2>
            <div style="display:flex; gap:8px; margin-bottom:10px;">
              <input type="text" id="blacklist-input" data-i18n-ph="blacklistPh">
              <button class="btn btn-red" data-i18n="blockBtn" onclick="modifyBlacklist('add')"></button>
            </div>
            <div id="blacklist-items" style="font-size:12px; color:var(--muted);"></div>
          </div>

          <div class="card">
            <h2 data-i18n="rulesTitle"></h2>
            <ul style="font-size:13px; color:var(--muted); padding-left:18px; margin:0;" id="rules-list"></ul>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 4: INBOX & SENT (SYNCED WITH TELEGRAM) -->
    <div id="tab-inbox" class="hidden">
      <div class="grid">
        <div>
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
              <h2 style="margin:0;" data-i18n="inboxTitle"></h2>
              <button class="btn btn-primary" data-i18n="syncInboxBtn" onclick="syncInboxNow()"></button>
            </div>
            <div id="inbox-sync-status" style="font-size:12px; color:var(--muted); margin-bottom:10px;"></div>
            <div id="inbox-list"></div>
          </div>
        </div>

        <div>
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
              <h2 style="margin:0;"><span data-i18n="sentLogTitle"></span> <span class="pill" id="sent-count-pill">0</span></h2>
              <div style="display:flex; gap:8px; align-items:center;">
                <input type="text" id="search-sent" data-i18n-ph="searchSentPh" style="max-width:210px;" oninput="renderInboxDynamic()">
                <a class="btn btn-ghost" href="/api/sent/export" data-i18n="exportSentBtn" style="text-decoration:none;"></a>
              </div>
            </div>
            <div class="scroll-table">
              <table>
                <thead>
                  <tr>
                    <th data-i18n="thTime"></th>
                    <th data-i18n="thEmail"></th>
                    <th data-i18n="thCompany"></th>
                    <th data-i18n="thMarket"></th>
                    <th data-i18n="thStatus"></th>
                  </tr>
                </thead>
                <tbody id="sent-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- CONFIRM MODAL -->
  <div class="modal-bg" id="confirm-modal">
    <div class="modal">
      <h2 data-i18n="confirmTitle"></h2>
      <div id="modal-summary" style="font-size:13px; color:var(--muted); margin-bottom:12px;"></div>
      <div id="modal-preview" style="background:#0b0e14; padding:12px; border-radius:8px; border:1px solid var(--border); font-size:12px; white-space:pre-wrap; max-height:220px; overflow:auto;"></div>
      <div id="modal-warnings"></div>
      <div class="btn-row" style="justify-content:flex-end;">
        <button class="btn btn-ghost" data-i18n="cancelBtn" onclick="closeModal()"></button>
        <button class="btn btn-green" id="modal-confirm-btn" data-i18n="confirmStartBtn" onclick="startCampaignConfirmed()"></button>
      </div>
    </div>
  </div>

    let LAST_LEADS_DATA = null;
    let LAST_SAFETY_RES = null;
    let LAST_INBOX_DATA = null;
    let ACTIVE_TAB = 'send';
    let UI_LANG = localStorage.getItem('outreach_ui_lang') || 'ru';

    function T() {
      return UI_I18N[UI_LANG] || UI_I18N.ru;
    }

    function fmt(str, vars) {
      return String(str).replace(/\{(\w+)\}/g, (_, k) => (vars[k] !== undefined ? vars[k] : ''));
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function switchTab(name, btn) {
      ACTIVE_TAB = name;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ['send', 'templates', 'accounts', 'inbox'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== name);
      });
      if (name === 'inbox') loadInbox();
    }

    function renderAlert(elId, type, text) {
      document.getElementById(elId).innerHTML = text ? `<div class="alert ${type}">${escapeHtml(text)}</div>` : '';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function collectTemplates(cfg) {
      const list = [];
      for (const group of ['by_key', 'extra']) {
        const obj = (cfg && cfg[group]) || {};
        for (const [k, v] of Object.entries(obj)) {
          list.push({ key: k, ...v });
        }
      }
      return list;
    }

    function setUiLang(lang) {
      UI_LANG = UI_I18N[lang] ? lang : 'ru';
      localStorage.setItem('outreach_ui_lang', UI_LANG);
      document.documentElement.lang = UI_LANG;
      const t = T();

      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active-lang'));
      const activeBtn = document.getElementById('lang-btn-' + UI_LANG);
      if (activeBtn) activeBtn.classList.add('active-lang');

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key] !== undefined) el.textContent = t[key];
      });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const key = el.getAttribute('data-i18n-ph');
        if (t[key] !== undefined) el.placeholder = t[key];
      });

      document.getElementById('rules-list').innerHTML = t.rules.map(r => `<li>${escapeHtml(r)}</li>`).join('');
      if (!STATE_DATA || !STATE_DATA.campaign.logs.length) {
        document.getElementById('log-box').textContent = t.logWait;
      }
      if (!LAST_SAFETY_RES) {
        document.getElementById('tpl-preview-box').textContent = t.tplPreviewHint;
      }

      if (STATE_DATA) renderStateDynamic();
      if (LAST_LEADS_DATA) renderLeadsDynamic();
      if (LAST_SAFETY_RES) renderSafety('safety-box', LAST_SAFETY_RES);
      if (LAST_INBOX_DATA) renderInboxDynamic();
    }

    function renderStateDynamic() {
      const data = STATE_DATA;
      const t = T();

      document.getElementById('shield-badge').textContent = t.shield;
      document.getElementById('stat-today').textContent = `${t.todayLbl}: ${data.stats.sent_today} / ${data.limits.default_daily_limit}`;
      document.getElementById('stat-total').textContent = `${t.totalLbl}: ${data.stats.total_sent}`;

      const tgBadge = document.getElementById('tg-badge');
      tgBadge.textContent = data.tg_enabled ? t.tgOn : t.tgOff;
      tgBadge.className = 'pill ' + (data.tg_enabled ? 'ok' : '');

      const running = data.campaign.running;
      document.getElementById('run-badge').textContent = running ? t.sending : t.ready;
      document.getElementById('run-badge').className = 'pill ' + (running ? 'warn' : 'ok');
      document.getElementById('btn-stop-top').classList.toggle('hidden', !running);
      document.getElementById('btn-start').disabled = running;
      document.getElementById('progress-pill').textContent = `${data.campaign.progress_current} / ${data.campaign.progress_total}`;

      if (data.campaign.logs.length) {
        const box = document.getElementById('log-box');
        box.textContent = data.campaign.logs.join('\n');
        box.scrollTop = box.scrollHeight;
      } else {
        document.getElementById('log-box').textContent = t.logWait;
      }

      const accSel = document.getElementById('account-select');
      const prevAcc = accSel.value;
      accSel.innerHTML = data.accounts.map(a =>
        `<option value="${escapeHtml(a.id)}">${escapeHtml(a.label)} — ${escapeHtml(a.sender_name)} &lt;${escapeHtml(a.sender_email)}&gt;</option>`
      ).join('') || `<option value="">${escapeHtml(t.noAccounts)}</option>`;
      if (prevAcc && data.accounts.some(a => a.id === prevAcc)) accSel.value = prevAcc;

      const srcSel = document.getElementById('source-select');
      const prevSrc = srcSel.value;
      srcSel.innerHTML = data.sources.map(s =>
        `<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)} (${s.count} ${escapeHtml(t.rowsWord)})</option>`
      ).join('');
      if (prevSrc && data.sources.some(s => s.name === prevSrc)) srcSel.value = prevSrc;

      const allTpls = collectTemplates(data.templates);
      const tplSel = document.getElementById('template-select');
      const prevTpl = tplSel.value;
      tplSel.innerHTML = `<option value="">${escapeHtml(t.tplAuto)}</option>` +
        allTpls.map(item => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.id)} (${escapeHtml(item.key)})</option>`).join('');
      if (prevTpl) tplSel.value = prevTpl;

      const editSel = document.getElementById('edit-tpl-select');
      const prevEdit = editSel.value;
      editSel.innerHTML = allTpls.map(item => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.id)} (${escapeHtml(item.key)})</option>`).join('');
      if (prevEdit) editSel.value = prevEdit;
      if (!document.getElementById('edit-tpl-subject').value && allTpls.length) loadTemplateIntoEditor();

      document.getElementById('accounts-list').innerHTML = data.accounts.map(a => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;">
          <div>
            <strong>${escapeHtml(a.label)}</strong> <span class="pill">${escapeHtml(a.provider.toUpperCase())}</span><br>
            <span style="color:var(--muted);">${escapeHtml(a.sender_name)} &lt;${escapeHtml(a.sender_email)}&gt;</span>
          </div>
          ${a.provider === 'smtp' ? `<button class="btn btn-ghost" data-id="${escapeHtml(a.id)}" onclick="deleteSmtp(this.dataset.id)">${escapeHtml(t.deleteBtn)}</button>` : `<span class="pill ok">${escapeHtml(t.primaryEnv)}</span>`}
        </div>
      `).join('');

      document.getElementById('blacklist-items').innerHTML = data.blacklist.length
        ? data.blacklist.map(b => `<span class="pill" style="margin:3px;">${escapeHtml(b)} <a href="#" data-entry="${escapeHtml(b)}" style="color:#f87171;text-decoration:none;margin-left:4px;" onclick="modifyBlacklist('remove',this.dataset.entry);return false;">×</a></span>`).join('')
        : escapeHtml(t.blacklistEmpty);
    }

    async function loadState() {
      const data = await api('/api/state');
      STATE_DATA = data;

      if (data.imap) {
        if (!document.getElementById('imap-user').value && data.imap.user) {
          document.getElementById('imap-user').value = data.imap.user;
        }
        if (data.imap.configured) {
          document.getElementById('imap-host').value = data.imap.host;
          document.getElementById('imap-port').value = data.imap.port;
        }
      }
      renderStateDynamic();
    }

    function phoneCellHtml(rawPhone) {
      const p = String(rawPhone || '').trim();
      if (!p) return '<span style="color:var(--muted);">—</span>';
      const digits = p.replace(/\D+/g, '');
      if (digits.length < 7) return escapeHtml(p);
      return `${escapeHtml(p)}<br><a href="https://wa.me/${digits}" target="_blank" rel="noopener" class="pill ok" style="text-decoration:none;margin-top:3px;">WA</a> <a href="https://t.me/+${digits}" target="_blank" rel="noopener" class="pill" style="text-decoration:none;margin-top:3px;color:#93c5fd;">TG</a>`;
    }

    function renderLeadsDynamic() {
      const data = LAST_LEADS_DATA;
      const t = T();
      document.getElementById('queue-count').textContent = data.stats.queued;
      document.getElementById('queue-stats').textContent = fmt(t.qStats, {
        tot: data.stats.total_rows || 0,
        sent: data.stats.skipped_sent || 0,
        bl: data.stats.skipped_blacklist || 0,
        cd: data.stats.skipped_domain_cooldown || 0,
      });

      document.getElementById('leads-tbody').innerHTML = data.rows.map(r => `
        <tr>
          <td>${escapeHtml(r.email)}</td>
          <td>${escapeHtml(r.company)}</td>
          <td>${phoneCellHtml(r.phone)}</td>
          <td><span class="pill">${escapeHtml(r.market || '-')}</span></td>
          <td>${escapeHtml(r.site_status)}</td>
          <td>${escapeHtml([r.city, r.niche].filter(Boolean).join(' · '))}</td>
        </tr>
      `).join('') || `<tr><td colspan="6" style="color:var(--muted);">${escapeHtml(t.noContacts)}</td></tr>`;
    }

    async function loadLeads() {
      const src = document.getElementById('source-select').value;
      const mkt = document.getElementById('market-select').value;
      const site = document.getElementById('site-select').value;
      const q = document.getElementById('search-leads').value;
      const qs = new URLSearchParams({ source: src, market: mkt, site_status: site, q });
      LAST_LEADS_DATA = await api('/api/leads?' + qs.toString());
      renderLeadsDynamic();
    }

    async function runSafetyCheck() {
      try {
        const res = await api('/api/safety/check', {
          method: 'POST',
          body: JSON.stringify({
            market: document.getElementById('market-select').value,
            site_status: document.getElementById('site-select').value,
            template_id: document.getElementById('template-select').value,
          }),
        });
        LAST_SAFETY_RES = res;
        renderSafety('safety-box', res);
        return res;
      } catch (e) {
        renderAlert('safety-box', 'err', e.message);
        return null;
      }
    }

    function renderSafety(elId, res) {
      const t = T();
      const s = res.safety;
      const cls = !s.ok ? 'err' : (s.warnings.length ? 'warn' : 'ok');
      const lines = [
        fmt(t.safetyHdr, { id: res.template_id, score: s.spam_score }),
        ...(s.errors || []).map(x => t.safetyErr + x),
        ...(s.warnings || []).map(x => t.safetyWarn + x),
        s.ok && !s.warnings.length ? t.safetyOk : '',
      ].filter(Boolean).join('\n');
      document.getElementById(elId).innerHTML = `<div class="alert ${cls}" style="white-space:pre-wrap;">${escapeHtml(lines)}</div>`;
    }

    async function openConfirmModal() {
      const t = T();
      const safetyRes = await runSafetyCheck();
      if (!safetyRes) return;

      const limit = Number(document.getElementById('limit-input').value || 25);
      const minD = Number(document.getElementById('min-delay').value || 90);
      const maxD = Number(document.getElementById('max-delay').value || 180);
      const accTxt = document.getElementById('account-select').selectedOptions[0]?.textContent || '';
      const qCount = document.getElementById('queue-count').textContent;

      document.getElementById('modal-summary').innerHTML = fmt(t.modalSum, {
        acc: escapeHtml(accTxt),
        q: escapeHtml(qCount),
        lim: limit,
        dmin: Math.max(45, minD),
        dmax: Math.max(45, maxD),
      });

      document.getElementById('modal-preview').textContent =
        `${t.subjectLbl}: ${safetyRes.rendered_subject}\n\n${safetyRes.rendered_body}`;

      renderSafety('modal-warnings', safetyRes);
      document.getElementById('modal-confirm-btn').disabled = !safetyRes.safety.ok;
      document.getElementById('confirm-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('confirm-modal').classList.remove('open');
    }

    async function startCampaignConfirmed() {
      closeModal();
      try {
        await api('/api/campaign/start', {
          method: 'POST',
          body: JSON.stringify({
            account_id: document.getElementById('account-select').value,
            source: document.getElementById('source-select').value,
            market: document.getElementById('market-select').value,
            site_status: document.getElementById('site-select').value,
            template_id: document.getElementById('template-select').value,
            limit: Number(document.getElementById('limit-input').value),
            min_delay: Number(document.getElementById('min-delay').value),
            max_delay: Number(document.getElementById('max-delay').value),
          }),
        });
        await loadState();
      } catch (e) {
        renderAlert('safety-box', 'err', e.message);
      }
    }

    async function stopCampaign() {
      await api('/api/campaign/stop', { method: 'POST', body: '{}' });
      await loadState();
    }

    async function sendTest() {
      const t = T();
      try {
        const res = await api('/api/test', {
          method: 'POST',
          body: JSON.stringify({
            account_id: document.getElementById('account-select').value,
            target_email: document.getElementById('test-email').value,
            market: document.getElementById('market-select').value,
            site_status: document.getElementById('site-select').value,
            template_id: document.getElementById('template-select').value,
          }),
        });
        renderAlert('test-result', 'ok', fmt(t.testSentMsg, { id: res.template_id, rid: res.id }));
      } catch (e) {
        renderAlert('test-result', 'err', e.message);
      }
    }

    async function importLeads() {
      const t = T();
      try {
        renderAlert('import-result', 'warn', t.checkingMx);
        const res = await api('/api/leads/import', {
          method: 'POST',
          body: JSON.stringify({
            raw_text: document.getElementById('import-text').value,
            target: document.getElementById('import-target').value,
            market: document.getElementById('market-select').value === 'ALL' ? 'EN' : document.getElementById('market-select').value,
            site_status: document.getElementById('site-select').value === 'ALL' ? 'no_site' : document.getElementById('site-select').value,
          }),
        });
        renderAlert('import-result', 'ok', fmt(t.importDone, {
          target: res.target,
          added: res.added,
          dup: res.duplicates,
          syn: res.invalid_syntax,
          mx: res.invalid_mx,
        }));
        document.getElementById('import-text').value = '';
        await loadState();
        await loadLeads();
      } catch (e) {
        renderAlert('import-result', 'err', e.message);
      }
    }

    function loadTemplateIntoEditor() {
      if (!STATE_DATA) return;
      const id = document.getElementById('edit-tpl-select').value;
      const item = collectTemplates(STATE_DATA.templates).find(x => x.id === id);
      if (!item) return;
      document.getElementById('edit-tpl-subject').value = item.subject;
      document.getElementById('edit-tpl-body').value = item.body;
    }

    async function previewTemplateEditor() {
      const t = T();
      try {
        const res = await api('/api/safety/check', {
          method: 'POST',
          body: JSON.stringify({
            template_id: document.getElementById('edit-tpl-select').value,
            subject: document.getElementById('edit-tpl-subject').value,
            body: document.getElementById('edit-tpl-body').value,
          }),
        });
        document.getElementById('tpl-preview-box').textContent = `${t.subjectLbl}: ${res.rendered_subject}\n\n${res.rendered_body}`;
        renderSafety('tpl-safety-result', res);
      } catch (e) {
        renderAlert('tpl-safety-result', 'err', e.message);
      }
    }

    async function saveTemplateEditor() {
      const t = T();
      try {
        await api('/api/templates/save', {
          method: 'POST',
          body: JSON.stringify({
            template_id: document.getElementById('edit-tpl-select').value,
            subject: document.getElementById('edit-tpl-subject').value,
            body: document.getElementById('edit-tpl-body').value,
          }),
        });
        renderAlert('tpl-save-result', 'ok', t.tplSaved);
        await loadState();
      } catch (e) {
        renderAlert('tpl-save-result', 'err', e.message);
      }
    }

    async function addSmtpAccount() {
      const t = T();
      try {
        renderAlert('smtp-result', 'warn', t.checkingSmtp);
        await api('/api/accounts/smtp', {
          method: 'POST',
          body: JSON.stringify({
            smtp_host: document.getElementById('smtp-host').value,
            smtp_port: Number(document.getElementById('smtp-port').value),
            sender_name: document.getElementById('smtp-name').value,
            smtp_user: document.getElementById('smtp-user').value,
            sender_email: document.getElementById('smtp-user').value,
            smtp_password: document.getElementById('smtp-pass').value,
          }),
        });
        renderAlert('smtp-result', 'ok', t.smtpOk);
        document.getElementById('smtp-pass').value = '';
        await loadState();
      } catch (e) {
        renderAlert('smtp-result', 'err', e.message);
      }
    }

    async function saveImap() {
      const t = T();
      try {
        renderAlert('imap-result', 'warn', t.checkingImap);
        await api('/api/imap', {
          method: 'POST',
          body: JSON.stringify({
            host: document.getElementById('imap-host').value,
            port: Number(document.getElementById('imap-port').value),
            user: document.getElementById('imap-user').value,
            password: document.getElementById('imap-pass').value,
          }),
        });
        renderAlert('imap-result', 'ok', t.imapOk);
        document.getElementById('imap-pass').value = '';
        await loadState();
      } catch (e) {
        renderAlert('imap-result', 'err', e.message);
      }
    }

    async function deleteSmtp(id) {
      await api('/api/accounts/delete', { method: 'POST', body: JSON.stringify({ id }) });
      await loadState();
    }

    async function modifyBlacklist(action, valueOverride = null) {
      const entry = valueOverride || document.getElementById('blacklist-input').value;
      try {
        await api('/api/blacklist', { method: 'POST', body: JSON.stringify({ action, entry }) });
        if (!valueOverride) document.getElementById('blacklist-input').value = '';
        await loadState();
        await loadLeads();
      } catch (e) {
        alert(e.message);
      }
    }

    async function loadInbox() {
      LAST_INBOX_DATA = await api('/api/inbox');
      renderInboxDynamic();
    }

    function renderInboxDynamic() {
      const data = LAST_INBOX_DATA;
      if (!data) return;
      const t = T();

      document.getElementById('inbox-sync-status').textContent = data.imap_configured
        ? fmt(t.inboxImapOk, { user: data.imap_user })
        : t.inboxNoImap;

      const items = data.items || [];
      document.getElementById('inbox-list').innerHTML = items.length ? items.map(it => {
        const ourReplies = (it.our_replies || []).map(r =>
          `<div style="margin-top:6px;padding:8px;border-radius:6px;background:#0f172a;border:1px solid #1e3a8a;font-size:12px;"><strong>${escapeHtml(t.ourReplyPrefix)} (${escapeHtml(r.via || 'web')}):</strong><br>${escapeHtml(r.text)}</div>`
        ).join('');
        return `
          <div style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;background:#0b0e14;">
            <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
              <div><strong>${escapeHtml(it.from_name || it.from_email)}</strong> &lt;${escapeHtml(it.from_email)}&gt;</div>
              <span class="pill ${it.status === 'INTERESTED' ? 'ok' : ''}">${escapeHtml(it.status || 'REPLIED')}</span>
            </div>
            <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">${escapeHtml(it.subject)}</div>
            <div style="font-size:13px;white-space:pre-wrap;max-height:140px;overflow:auto;">${escapeHtml(it.body)}</div>
            ${ourReplies}
            <div style="margin-top:8px;">
              <textarea id="reply-box-${escapeHtml(it.id)}" placeholder="${escapeHtml(t.replyPh)}" style="min-height:60px;"></textarea>
              <div class="btn-row">
                <button class="btn btn-primary" data-id="${escapeHtml(it.id)}" onclick="sendWebReply(this.dataset.id)">${escapeHtml(t.sendReplyBtn)}</button>
                <button class="btn btn-green" data-id="${escapeHtml(it.id)}" onclick="setInboxStatus(this.dataset.id, 'INTERESTED')">${escapeHtml(t.leadBtn)}</button>
                <button class="btn btn-ghost" data-id="${escapeHtml(it.id)}" onclick="setInboxStatus(this.dataset.id, 'CLOSED')">${escapeHtml(t.doneBtn)}</button>
                <button class="btn btn-red" data-id="${escapeHtml(it.id)}" onclick="setInboxStatus(this.dataset.id, 'BLOCKED')">${escapeHtml(t.blockBtn)}</button>
              </div>
              <div id="inbox-item-msg-${escapeHtml(it.id)}"></div>
            </div>
          </div>
        `;
      }).join('') : `<div style="font-size:13px;color:var(--muted);">${escapeHtml(t.inboxEmpty)}</div>`;

      const q = (document.getElementById('search-sent').value || '').trim().toLowerCase();
      const sentFiltered = (data.sent || []).filter(s =>
        !q || String(s.email || '').toLowerCase().includes(q) || String(s.company || '').toLowerCase().includes(q)
      );
      document.getElementById('sent-count-pill').textContent = (data.sent || []).length;
      document.getElementById('sent-tbody').innerHTML = sentFiltered.map(s => `
        <tr>
          <td>${escapeHtml(String(s.sent_at || '').slice(0, 16).replace('T', ' '))}</td>
          <td>${escapeHtml(s.email || '')}</td>
          <td>${escapeHtml(s.company || '')}</td>
          <td><span class="pill">${escapeHtml(s.market || '-')}</span></td>
          <td><span class="pill ${s.status === 'sent' ? 'ok' : ''}">${escapeHtml(s.status || '')}</span></td>
        </tr>
      `).join('') || `<tr><td colspan="5" style="color:var(--muted);">${escapeHtml(t.sentEmpty)}</td></tr>`;
    }

    async function syncInboxNow() {
      const t = T();
      try {
        const res = await api('/api/inbox/sync', { method: 'POST', body: '{}' });
        document.getElementById('inbox-sync-status').textContent = fmt(t.syncDoneMsg, { n: res.added });
        await loadInbox();
      } catch (e) {
        renderAlert('inbox-sync-status', 'err', e.message);
      }
    }

    async function sendWebReply(id) {
      const t = T();
      const box = document.getElementById('reply-box-' + id);
      try {
        const res = await api('/api/inbox/reply', {
          method: 'POST',
          body: JSON.stringify({
            id,
            text: box.value,
            account_id: document.getElementById('account-select').value,
          }),
        });
        box.value = '';
        renderAlert('inbox-item-msg-' + id, 'ok', fmt(t.replySentOk, { email: res.email }));
        await loadInbox();
      } catch (e) {
        renderAlert('inbox-item-msg-' + id, 'err', e.message);
      }
    }

    async function setInboxStatus(id, status) {
      const t = T();
      try {
        const res = await api('/api/inbox/status', {
          method: 'POST',
          body: JSON.stringify({ id, status }),
        });
        renderAlert('inbox-item-msg-' + id, 'ok', fmt(t.statusSavedOk, { email: res.email, st: res.status }));
        await loadInbox();
        await loadState();
        await loadLeads();
      } catch (e) {
        renderAlert('inbox-item-msg-' + id, 'err', e.message);
      }
    }

    (async () => {
      setUiLang(UI_LANG);
      await loadState();
      await loadLeads();
      await loadInbox();
      setInterval(() => {
        if (STATE_DATA && STATE_DATA.campaign && STATE_DATA.campaign.running) {
          loadState();
        }
        if (ACTIVE_TAB === 'inbox') {
          loadInbox();
        }
      }, 3000);
    })();
  </script>
</body>
</html>
